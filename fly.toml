# fly.toml app configuration file generated for claude-app-builder on 2025-07-23T22:19:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'claude-app-builder'
primary_region = "atl"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.ports]]
    handlers = ["http"]
    port = 80

  [[http_service.ports]]
    handlers = ["tls", "http"]
    port = 443

  [http_service.http_checks]
    interval = "10s"
    timeout = "5s"
    grace_period = "5s"
    method = "get"
    path = "/claude/health"
    protocol = "http"
    restart_limit = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
